[package]
name = "deeptrace"
version = "0.1.0-beta.2"
description = "DeepTrace — Custom AI Desktop App for Reverse Engineering"
authors = ["DeepTrace"]
edition = "2021"

[lib]
name = "deeptrace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
